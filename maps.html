<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <!-- Leaflet -->
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

     <!-- Make sure you put this AFTER Leaflet's CSS -->
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

     <style>
        #map { height: 680px; }
        .popup-image {
            max-width: 200px;
            height: auto;
        }
     </style>

</head>
<body>
    <h1>Basic Map</h1>
    <div id="map"></div>
</body>
<script>

    var map = L.map('map').setView([8.360053042057906, 124.86834154336864], 17);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
var marker = L.marker([8.360053042057906, 124.86834154336864]).addTo(map);
const dogeImage = "<img src='https://encrypted-tbn2.gstatic.com/images?q=tbn:ANd9GcSz25nYKDXPpKqhZiXKmC4K00TpYAy4cj83mWPB6UlEXyHS_8K8BoTcJmXkriBIyIR87eySEaEZstDTVZAztwe5RCRgNRe4MO1OSZ1Jf8eE' class='popup-image'>";
const popupContent = `${dogeImage}<br><b>Hello world!</b><br>I am a popup.`;

marker.bindPopup(popupContent).openPopup();

function initMap(mapDataUrl){

    var map = L.map('map').setView([8.360047179637865, 124.86822530594878], 17);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

fetch(mapDataUrl)
.then(response => response.json())
.then(data.forEach(pin=>{
    const marker = L.marker([pin.lst,pin.lng]).addTo(map);
    const img = `<img src='$(pin.img)' class=popup-image>`;
    const popupContent = `${img}<br><b> ${pin.tittle} </b><br> ${pin.description}`;

    console.log(`${pin.name} Loaded` +date());
}));

}

</script>
</html>
